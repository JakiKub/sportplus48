        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const scale = 1 / window.devicePixelRatio;
                document.body.style.transform = `scale(${scale})`;
                document.body.style.transformOrigin = 'top left';
                document.body.style.width = `${100 * window.devicePixelRatio}%`;
                document.body.style.height = `${100 * window.devicePixelRatio}%`;
                document.body.style.position = 'absolute';
                document.body.style.top = 0;
                document.body.style.left = 0;
            });
            document.addEventListener("DOMContentLoaded", () => {
                const user = JSON.parse(localStorage.getItem("user"));

                const navbarUserEmailTopWrapper = document.getElementById("navbarUserEmailTopWrapper");

                if (user && navbarUserEmailTopWrapper) {
                    document.getElementById("usernameDashboardTop").textContent = user.username;
                    document.getElementById("emailDashboardTop").textContent = user.email;
                    document.getElementById("navbarTop").style.display = "flex";
                    //document.getElementById("navbarAddActivLoggedInTop").style.display = "flex";
                }

                const profileLogOut = document.getElementById("profileLogOut");
                if (profileLogOut) {
                    profileLogOut.addEventListener("click", () => {
                    localStorage.removeItem("user");
                    location.href = "dashboard.html";
                    //location.reload();
                    });
                };
            })

            document.addEventListener("DOMContentLoaded", () => {
                const bttnLeft = document.getElementById("rankChangeLeft");
                const bttnRight = document.getElementById("rankChangeRight");
                const xOf7 = document.getElementById("xOfSeven");

                const t1 = document.getElementById("rankingTable1");
                const t2 = document.getElementById("rankingTable2");
                const t3 = document.getElementById("rankingTable3");
                const t4 = document.getElementById("rankingTable4");
                const t5 = document.getElementById("rankingTable5");
                const t6 = document.getElementById("rankingTable6");
                const t7 = document.getElementById("rankingTable7");

                const animateText = () => {
                    xOf7.classList.remove("fadeaway");
                    setTimeout(()=> {
                        xOf7.classList.add("fadeaway");
                    }, 10);
                };

                const animateT1 = () => {
                    t1.classList.remove("fadeout");
                    setTimeout(() => {
                        t1.classList.add("fadeout");
                    }, 10);
                };
                const animateT2 = () => {
                    t2.classList.remove("fadeout");
                    setTimeout(() => {
                        t2.classList.add("fadeout");
                    }, 10);
                };
                const animateT3 = () => {
                    t3.classList.remove("fadeout");
                    setTimeout(() => {
                        t3.classList.add("fadeout");
                    }, 10);
                };
                const animateT4 = () => {
                    t4.classList.remove("fadeout");
                    setTimeout(() => {
                        t4.classList.add("fadeout");
                    }, 10);
                };
                const animateT5 = () => {
                    t5.classList.remove("fadeout");
                    setTimeout(() => {
                        t5.classList.add("fadeout");
                    }, 10);
                };
                const animateT6 = () => {
                    t6.classList.remove("fadeout");
                    setTimeout(() => {
                        t6.classList.add("fadeout");
                    }, 10);
                };
                const animateT7 = () => {
                    t7.classList.remove("fadeout");
                    setTimeout(() => {
                        t7.classList.add("fadeout");
                    }, 10);
                };

                bttnLeft.onclick = function() {
                    if (window.getComputedStyle(t1).display === "flex") {
                        t1.style.display = "none";
                        t7.style.display = "flex";
                        xOf7.innerText = "7 of 7";
                        animateText();
                        animateT7();
                    } else if (window.getComputedStyle(t2).display === "flex") {
                        t2.style.display = "none";
                        t1.style.display = "flex"
                        xOf7.innerText = "1 of 7";
                        animateText();
                        animateT1();
                    } else if (window.getComputedStyle(t3).display === "flex") {
                        t3.style.display = "none";
                        t2.style.display = "flex";
                        xOf7.innerText = "2 of 7";
                        animateText();
                        animateT2();
                    } else if (window.getComputedStyle(t4).display === "flex") {
                        t4.style.display = "none";
                        t3.style.display = "flex";
                        xOf7.innerText = "3 of 7";
                        animateText();
                        animateT3();
                    } else if (window.getComputedStyle(t5).display === "flex") {
                        t5.style.display = "none";
                        t4.style.display = "flex";
                        xOf7.innerText = "4 of 7";
                        animateText();
                        animateT4();
                    } else if (window.getComputedStyle(t6).display === "flex") {
                        t6.style.display = "none";
                        t5.style.display = "flex";
                        xOf7.innerText = "5 of 7";
                        animateText();
                        animateT5();
                    } else if (window.getComputedStyle(t7).display === "flex") {
                        t7.style.display = "none";
                        t6.style.display = "flex";
                        xOf7.innerText = "6 of 7";
                        animateText();
                        animateT6();
                    }
                };

                bttnRight.onclick = function() {
                    if (window.getComputedStyle(t1).display === "flex") {
                        t1.style.display = "none";
                        t2.style.display = "flex";
                        xOf7.innerText = "2 of 7";
                        animateText();
                        animateT2();
                    } else if (window.getComputedStyle(t2).display === "flex") {
                        t2.style.display = "none";
                        t3.style.display = "flex";
                        xOf7.innerText = "3 of 7";
                        animateText();
                        animateT3();
                    } else if (window.getComputedStyle(t3).display === "flex") {
                        t3.style.display = "none";
                        t4.style.display = "flex";
                        xOf7.innerText = "4 of 7";
                        animateText();
                        animateT4();
                    } else if (window.getComputedStyle(t4).display === "flex") {
                        t4.style.display = "none";
                        t5.style.display = "flex";
                        xOf7.innerText = "5 of 7";
                        animateText();
                        animateT5();
                    } else if (window.getComputedStyle(t5).display === "flex") {
                        t5.style.display = "none";
                        t6.style.display = "flex";
                        xOf7.innerText = "6 of 7";
                        animateText();
                        animateT6();
                    } else if (window.getComputedStyle(t6).display === "flex") {
                        t6.style.display = "none";
                        t7.style.display = "flex";
                        xOf7.innerText = "7 of 7";
                        animateText();
                        animateT7();
                    } else if (window.getComputedStyle(t7).display === "flex") {
                        t7.style.display = "none";
                        t1.style.display = "flex";
                        xOf7.innerText = "1 of 7";
                        animateText();
                        animateT1();
                    }
                };
            })

            async function loadRanks() {
                const res = await fetch('/api/ranking', { credentials: "include" });
                const rankData = await res.json();
                /*const top1 = rankData.mostPoints[0];
                const top2 = rankData.mostPoints[1];
                const top3 = rankData.mostPoints[2];

                document.getElementById("top1country").innerText = top1.nationality;
                document.getElementById("top1User").innerText = top1.username;
                document.getElementById("top1Pts").innerText = top1.pointsAll.toFixed(3);*/

                rankData.mostPoints.forEach((user, index) => {
                    const rank = index + 1;
                    if (rank > 48) return;

                    document.getElementById(`top${rank}country`).innerText = user.nationality || "-";
                    document.getElementById(`top${rank}User`).innerText = user.username || "-";
                    document.getElementById(`top${rank}Pts`).innerText = user.pointsAll.toFixed(3);
                })
            }

            loadRanks();
        </script>
    </body>
</html>
