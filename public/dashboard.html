<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="shortcut icon" href="../content/logo-ikona-str.png">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <script src="index.js" defer></script>
    </head>
    <body class="dashboard">
        <img src="../content/logohuju.png" class="logo-hóju" id="logoHóju">
        <div class="navbar-dashboard-logged-out" id="navbarDashboardLoggedOut">
            <p><a href="dashboard.html">dashboard</a></p>
            <p><a href="home.html">home</a></p>
            <p><a href="about-us.html">about us</a></p>
            <p><a href="sports.html">sports</a></p>
            <p><a href="actions.html">actions</a></p>
            <p><a href="coutries.html">countries</a></p>
            <p><a href="contact.html">contact</a></p>
            <p class="troll" id="testPTroll">EN</p>
        </div>
        <div id="navbarDashboardLoggedInTop">
            <button id="userBttn" class="user-bttn"></button>
            <div id="navbarUserEmailTopWrapper" class="navbar-user-email-top-wrapper">
                <h3 class="navbar-logged-in-top-username"><span id="usernameDashboardTop"></span></h3>
                <p class="navbar-logged-in-top-email"><span id="emailDashboardTop"></span></p>
            </div>
        </div>
        <div id="navbarTop">
            <button id="enBttn" class="en-bttn"></button>
            <button id="notifBttn" class="notif-bttn"></button>
            <button id="profileLogOut" class="logout-bttn"></button>
        </div>
        <div class="some-text" id="someText">
            <img src="../content/keep working title dashboard.png" id="keepWorking">
            <p id="someTextP">Believe in your own abilities and take one step each day on your way to the top</p>
        </div>
        <div class="sc-starts-in" id="scStartsIn">
            <img src="../content/chujchujchuj1.png" id="scImg">
            <div class="dsh-days" id="dshDays">
                <p id="dshDaysNumber"></p>
                <p id="dshDaysP">DAYS</p>
            </div>
            <div class="dsh-hours" id="dshHours">
                <p id="dshHoursNumber"></p>
                <p id="dshHoursP">HOURS</p>
            </div>
            <div class="dsh-minutes" id="dshMinutes">
                <p id="dshMinutesNumber"></p>
                <p id="dshMinutesP">MINUTES</p>
            </div>
            <div class="dsh-seconds" id="dshSeconds">
                <p id="dshSecondsNumber"></p>
                <p id="dshSecondsP">SECONDS</p>
            </div>
        </div>
         <div class="navbar-logged-in" id="navbarDashboardLoggedIn">
            <div class="navbar-logged-in-main">
                <img src="../content/dsh main.png" class="main-dsh">
                <a href="dashboard.html"><img src="../content/sb dashboard.png" class="dashboard-ico"></a>
                <a href="home.html"><img src="../content/sb home.png" class="home-ico"></a>
            </div>
            <div class="navbar-logged-in-ypttt">
                <img src="../content/dsh your.png" class="ypttp-dsh">
                <a href="add-activity.html"><img src="../content/sb register activity.png" class="add-activ-ico"></a>
                <a href="progress.html"><img src="../content/sb progress.png" class="progress-ico"></a>
                <a><img src="../content/sb records.png" class="records-ico"></a>
                <a><img src="../content/sb points.png" class="points-ico"></a>
            </div>
            <div class="navbar-logged-in-other">
                <img src="../content/dsh other.png" class="other-dsh">
                <a><img src="../content/sb ranking.png" class="ranking-ico"></a>
                <a href="actions.html"><img src="../content/sb 48sc.png" class="challenge-ico"></a>
            </div>
        </div>
        <div class="streak-container" id="streakContainer">
            <div class="streak-counter-div">
                <span id="streak" data-value="0" class="streak-counter"></span>
            </div>
            <button id="streakButton"><img src="../content/streak2.png"></button>
            <a class="streak-lm" id="streakLearnMore">Learn more</a>
        </div>
        <div class="daily-challenge" id="dailyChallenge">
            <h3 id="challenge"></h3>
        </div>
        <div class="motiv-quote" id="motivQuote">
            <button id="quoteChange"></button>
            <div id="randomQuote">
                <h3 id="quote"></h3>
                <p id="person"></p>
            </div>
        </div>
        <div class="personal-goals" id="personalGoals">
            
        </div>
        <div class="get-inspired" id="getInspired">
            <button id="inspirChange"></button>
            <p id="textInGetInspir"></p>
        </div>
         <!-- profileContainer i tak sie nie wyswietla wiec jest tylko do warunku w index.js krotko mowiac nie usuwac tego. dziala to dziala -->
        <div class="profile-container" id="profileContainer" style="display: none;">
            <h1 class="profile"><span id="username" class="profile"></span></h1>
            <p class="profile"><span id="nationality" class="profile"></span></p>
        </div>
        <div class="log-in-register">
            <button id="logInButton" class="log-in">LOG IN</button>
            <button id="registerButton" class="register">REGISTER</button>
        </div>
        <div id="logInModalContainer" class="log-in-modal-container">
            <div class="log-in-modal">
                <form id="logInForm">
                    <button id="logInClose" class="log-in-close"><img src="../content/Xbutton.png"></button>
                    <img src="../content/Login3.png" id="loginText">
                    <img src="../content/Login4.png" id="loginEmailText">
                    <img src="../content/Login5.png" id="loginPasswordText">
                    <input type="email" id="logInEmail" name="email" class="email" required>
                    <input type="password" id="logInPassword" name="password" class="password" required>
                    <p><a href="forgot-password.html">Forgot your password?</a></p>
                    <button type="submit" class="log-in-in-modal"><img src="../content/LoginButton.png"></button>
                </form>
            </div>
        </div>
        <div id="registerModalContainer" class="register-modal-container">
            <div class="register-modal">
                <form action="/register" method="post">
                    <button id="registerClose" class="register-close" type="button"><img src="../content/Xbutton.png"></button>
                    <img src="../content/Register3.png" id="registerTextTop">
                    <img src="../content/Register4.png" id="registerEmailText">
                    <img src="../content/Register5.png" id="registerPasswordText">
                    <input type="email" id="registerEmail" name="email" class="email" required>
                    <input type="password" id="registerPassword" name="password" class="password" required>
                    <img src="../content/Register6.png" id="registerUsernameText">
                    <img src="../content/Register7.png" id="registerNationalityText">
                    <input type="text" id="username" name="username" class="username" maxlength="20" required>
                    <input list="nationalities" name="nationality" class="nationalities">
                    <datalist id="nationalities" class="nationalities">
                        <option value="Poland">Poland</option>
                        <option value="England">England</option>
                    </datalist>
                    <!-- <p class="termsOfServiceText"><input type="checkbox" class="termsOfService" required>I accept terms of service</p> -->
                    <button type="submit" class="register-in-modal"><img src="../content/RegisterButton.png"></button>
                    <img src="../content/Register2.png" id="registerTextBottom">
                </form>
            </div>
        </div>
        <div class="logo" id="logoDashboard">
            <div class="tiktok-logo">
                <a href="https://www.tiktok.com/@sportplus_48?_t=ZN-8y3YHZlLIAw&_r=1"><img src="../content/tiktok-png.png"></a>
            </div>
            <div class="instagram-logo">
                <a href="https://www.instagram.com/sportplus.48?igsh=MXFweHYyd204aTViMg=="><img src="../content/instagram-png.png"></a>
            </div>
        </div>
    </body>
</html>
