<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset your password</title>
        <link rel="shortcut icon" href="../content/logo-ikona-str.png">
        <link rel="stylesheet" href="/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    </head>
    <body class="reset-password">
        <div class="navbar">
            <a href="dashboard.html">dashboard</a>
            <a href="home.html">home</a>
            <a href="about-us.html">about us</a>
            <a href="articles.html">articles</a>
            <a href="actions.html">actions</a>
            <a href="coutries.html">countries</a>
            <a href="contact.html">contact</a>
            <a class="troll"><img src="../content/en-bttn.png"></a>
        </div>
        <form id="resetForm">
            <input type="password" name="password" placeholder="nowe haslo" required />
            <button type="submit">zresetuj haslo</button>
        </form>
        <div class="logo">
            <div class="tiktok-logo">
                <a href="https://www.tiktok.com/@sportplus_48?_t=ZN-8y3YHZlLIAw&_r=1"><img src="../content/tiktok-png.png"></a>
            </div>
            <div class="instagram-logo">
                <a href="https://www.instagram.com/sportplus.48?igsh=MXFweHYyd204aTViMg=="><img src="../content/instagram-png.png"></a>
            </div>
        </div>

        <script>
            const token = window.location.pathname.split('/').pop();
            const form = document.getElementById('resetForm');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const res = await fetch(`/reset-password/${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: form.password.value })
                });

                const msg = await res.text();
                alert(msg);
                if (res.ok) window.location.href = '/';
            });
        </script>
    </body>
</html>
