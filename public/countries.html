<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">   
        <title>Sport +48 - Countries</title>
        <link rel="shortcut icon" href="../content/icons/logo-ikona-str.png">
        <link rel="stylesheet" href="/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
        
    </head>
    <body class="countries">
        <div class="navbar">
            <a href="dashboard.html">dashboard</a>
            <a href="home.html">home</a>
            <a href="about-us.html">about us</a>
            <a href="articles.html">articles</a>
            <a href="actions.html">actions</a>
            <a href="coutries.html">countries</a>
            <a href="contact.html">contact</a>
            <a class="troll"><img src="../content/buttons/en-bttn.png"></a>
        </div>
        <div class="list-main" id="countriesList">
            <button class="list-bttn-one" id="listBttnCountries">COUNTRIES</button>
            <div class="list-rozw" id="countriesListRozw">
                <button class="list-bttn-two" id="dshBttnCountries">DASHBOARD</button>
                <button class="list-bttn-two" id="homeBttnCountries">HOME</button>
                <button class="list-bttn-two" id="abtUsBttnCountries">ABOUT US</button>
                <button class="list-bttn-two" id="actionsBttnCountries">ACTIONS</button>
                <button class="list-bttn-two" id="contactBttnCountries">CONTACT</button>
                <button class="list-bttn-two" id="articlesBttnCountries">ARTICLES</button>
                <button class="list-bttn-two" id="countriesBttnCountries">COUNTRIES</button>
            </div>
        </div>
        <div class="jakies-napisy" id="jakiesNapisy">
            <img src="../content/titles/Countries Title.png" id="countriesTitle">
            <img src="../content/texts/Napis1.png" id="napisJeden">
        </div>
        <div class="countries-counter">
            <div id="countriesNumber" data-value="1"></div>
            <img src="../content/texts/Napis2.png" id="napisDwa">
            <div class="countries-slider">
                <button id="countriesSlideLeft"><img src="../content/buttons/bt1.png"></button>
                <div id="currentCountry"></div>
                <button id="countriesSlideRight"><img src="../content/buttons/bt2.png"></button>

            </div>
        </div>
        <div class="logo">
            <div class="tiktok-logo">
                <a href="https://www.tiktok.com/@sportplus_48?_t=ZN-8y3YHZlLIAw&_r=1"><img src="../content/logos/tiktok-png.png"></a>
            </div>
            <div class="instagram-logo">
                <a href="https://www.instagram.com/sportplus.48?igsh=MXFweHYyd204aTViMg=="><img src="../content/logos/instagram-png.png"></a>
            </div>
        </div>
        <img src="../content/misc/earth-countries.png" id="earthCountries">

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const scale = 1 / window.devicePixelRatio;
                document.body.style.transform = `scale(${scale})`;
                document.body.style.transformOrigin = 'top left';
                document.body.style.width = `${100 * window.devicePixelRatio}%`;
                document.body.style.height = `${100 * window.devicePixelRatio}%`;
                document.body.style.position = 'absolute';
                document.body.style.top = 0;
                document.body.style.left = 0;
            });
            
            document.addEventListener("DOMContentLoaded", () => {
                const countriesNumber = document.getElementById("countriesNumber");
                countriesNumber.textContent = countriesNumber.dataset.value;

                const countriesSlideLeft = document.getElementById("countriesSlideLeft");
                const countriesSlideRight = document.getElementById("countriesSlideRight");
                const currentCountry = document.getElementById("currentCountry");

                const countrySlideLeft = document.getAnimations("countrySlideLeft")[0];
                const countrySlideRight = document.getAnimations("countrySlideRight")[0];

                const countries = [
                    "POL",
                    //"HUN",
                    //"ESP",
                ]
                let currentIndex = 0;

                countriesSlideRight.onclick = function() {
                    currentIndex = (currentIndex + 1) % countries.length;
                    updateCountries();

                    currentCountry.classList.remove('slide-left');
                    
                    void currentCountry.offsetWidth;

                    currentCountry.classList.add('slide-left');
                }
                countriesSlideLeft.onclick = function() {
                    currentIndex = (currentIndex - 1 + countries.length) % countries.length;
                    updateCountries();

                    currentCountry.classList.remove('slide-right');
                    
                    void currentCountry.offsetWidth;

                    currentCountry.classList.add('slide-right');
                }

                const updateCountries = () => {
                    const currentBackground = countries[currentIndex];
                    currentCountry.style.backgroundImage = `url('../content/icons/${currentBackground}-countries.png')`;
                }
            })

            document.addEventListener("DOMContentLoaded", () => {
                const listBttnCountries = document.getElementById("listBttnCountries");
                const countriesListRozw = document.getElementById("countriesListRozw");
                const abtUsBttnCountries = document.getElementById("abtUsBttnCountries");
                const dshBttnCountries = document.getElementById("dshBttnCountries");
                const actionsBttnCountries = document.getElementById("actionsBttnCountries");
                const contactBttnCountries = document.getElementById("contactBttnCountries");
                const articlesBttnCountries = document.getElementById("articlesBttnCountries");
                const countriesBttnCountries = document.getElementById("countriesBttnCountries");
                const jakiesNapisy = document.getElementById("jakiesNapisy");
                const homeBttnCountries = document.getElementById("homeBttnCountries");

                listBttnCountries.addEventListener("click", () => {
                    countriesListRozw.classList.toggle("is-active-countries");
                    jakiesNapisy.classList.toggle("is-activ-count");
                })

                abtUsBttnCountries.addEventListener("click", () => {
                    window.location.href = "about-us.html";
                });

                actionsBttnCountries.addEventListener("click", () => {
                    window.location.href = "actions.html";
                });
                
                contactBttnCountries.addEventListener("click", () => {
                    window.location.href = "contact.html";
                });

                articlesBttnCountries.addEventListener("click", () => {
                    window.location.href = "articles.html";
                });

                countriesBttnCountries.addEventListener("click", () => {
                    window.location.href = "countries.html";
                });

                dshBttnCountries.addEventListener("click", () => {
                    window.location.href = "dashboard.html";
                });

                homeBttnCountries.addEventListener("click", () => {
                    window.location.href = "home.html";
                })
            })
        </script>
    </body>
</html>
