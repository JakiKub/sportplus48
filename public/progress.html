<!DOCTYPE html>
<html>
    <head>
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZPN0Q6QMXV"></script>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Progress - Sport +48</title>
        <link rel="shortcut icon" href="../content/icons/logo-ikona-str.png">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    </head>
    <body class="progress">
        <div id="menuListPrgrss">
            <button id="menuListProgress"><img src="../content/mobile-version/menu-progress.png"></button>
            <div id="listOfElementsProgress">
                <button id="homeBttnProgress">HOME</button>
                <button id="dshBttnProgress">DASHBOARD</button>
                <button id="activBttnProgress">REGISTER ACTIVITY</button>
                <button id="progressBttnProgress">PROGRESS</button>
                <button id="recordsBttnProgress">RECORDS</button>
                <button id="pointsBttnProgress">POINTS</button>
                <button id="rankingBttnProgress">RANKING</button>
                <button id="actionsBttnProgress">48 SPORT CHALLENGE</button>
            </div>
        </div>
        <img src="../content/logos/logohuju.png" class="logo-hóju">
        <div class="navbar-logged-in" id="navbarProgressLoggedIn">
            <div class="navbar-logged-in-main">
                <img src="../content/titles/dsh main.png" class="main-dsh">
                <a href="dashboard.html"><img src="../content/titles/sb dashboard.png" class="dashboard-ico"></a>
                <a href="home.html"><img src="../content/titles/sb home.png" class="home-ico"></a>
            </div>
            <div class="navbar-logged-in-ypttt">
                <img src="../content/titles/dsh your.png" class="ypttp-dsh">
                <a href="add-activity.html"><img src="../content/titles/sb register activity.png" class="add-activ-ico"></a>
                <a href="progress.html"><img src="../content/titles/sb progress.png" class="progress-ico"></a>
                <a href="records.html"><img src="../content/titles/sb records.png" class="records-ico"></a>
                <a href="points.html"><img src="../content/titles/sb points.png" class="points-ico"></a>
            </div>
            <div class="navbar-logged-in-other">
                <img src="../content/titles/dsh other.png" class="other-dsh">
                <a href="ranking.html"><img src="../content/titles/sb ranking.png" class="ranking-ico"></a>
                <a href="actions.html"><img src="../content/titles/sb 48sc.png" class="challenge-ico"></a>
            </div>
        </div>
        <!--flex moment-->
        <div class="main-prgrss-wrapper" id="mainPrgrssWrapper">
            <div class="nvbr-prgrss-txt-wrapper">
                <div class="nvbr-wrapper">
                    <div id="navbarProgressTop">
                        <button id="userBttn" class="user-bttn"></button>
                        <div id="navbarUserEmailTopWrapper" class="navbar-user-email-top-wrapper">
                            <h3 class="navbar-logged-in-top-username"><span id="usernameDashboardTop"></span></h3>
                            <p class="navbar-logged-in-top-email"><span id="emailDashboardTop"></span></p>
                        </div>
                    </div>
                    <div id="navbarTop" class="navbar-user-email-top-wrapper">
                        <button id="enBttn" class="en-bttn"></button>
                        <button id="notifBttn" class="notif-bttn"></button>
                        <button id="profileLogOut" class="logout-bttn"></button>
                    </div>
                </div>
                <div class="progress-text">
                    <img src="../content/titles/progress title.png" id="progressTitle">
                    <p id="pProgress">Check your progress every day via our website</p>
                </div>
            </div>
            <table id="progressTable">
                <thead>
                    <tr class="tr-head">
                        <th>Status</th>
                        <th>Date</th>
                        <th>Activity</th>
                        <th>Distance</th>
                        <th>Time</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const scale = 1 / window.devicePixelRatio;
                document.body.style.transform = `scale(${scale})`;
                document.body.style.transformOrigin = 'top left';
                document.body.style.width = `${100 * window.devicePixelRatio}%`;
                document.body.style.height = `${100 * window.devicePixelRatio}%`;
                document.body.style.position = 'absolute';
                document.body.style.top = 0;
                document.body.style.left = 0;
            });

            document.addEventListener("DOMContentLoaded", () => {
                const user = JSON.parse(localStorage.getItem("user"));

                const navbarUserEmailTopWrapper = document.getElementById("navbarUserEmailTopWrapper");

                if (user && navbarUserEmailTopWrapper) {
                    document.getElementById("usernameDashboardTop").textContent = user.username;
                    document.getElementById("emailDashboardTop").textContent = user.email;
                    document.getElementById("navbarTop").style.display = "flex";
                    //document.getElementById("navbarAddActivLoggedInTop").style.display = "flex";
                }

                const profileLogOut = document.getElementById("profileLogOut");
                if (profileLogOut) {
                    profileLogOut.addEventListener("click", () => {
                    localStorage.removeItem("user");
                    location.href = "dashboard.html";
                    //location.reload();
                    });
                };
            });

            document.addEventListener("DOMContentLoaded", () => {
                const menuListProgress = document.getElementById("menuListProgress");
                const listOfElementsProgress = document.getElementById("listOfElementsProgress");
                const activBttnProgress = document.getElementById("activBttnProgress");
                const progressBttnProgress = document.getElementById("progressBttnProgress");
                const recordsBttnProgress = document.getElementById("recordsBttnProgress");
                const pointsBttnProgress = document.getElementById("pointsBttnProgress");
                const rankingBttnProgress = document.getElementById("rankingBttnProgress");
                const actionsBttnProgress = document.getElementById("actionsBttnProgress");
                const dshBttnProgress = document.getElementById("dshBttnProgress");
                const homeBttnProgress = document.getElementById("homeBttnProgress");
                

                menuListProgress.addEventListener("click", () => {
                    listOfElementsProgress.classList.toggle("is-active-progress");
                    document.getElementById("progressTable").classList.toggle("darken-progress");
                    //document.querySelector(".main-prgrss-wrapper").classList.toggle("darken-progress");
                });

                dshBttnProgress.addEventListener("click", () => {
                    window.location.href = "dashboard.html";
                });

                activBttnProgress.addEventListener("click", () => {
                    window.location.href = "add-activity.html";
                });

                progressBttnProgress.addEventListener("click", () => {
                    window.location.href = "progress.html";
                });

                recordsBttnProgress.addEventListener("click", () => {
                    window.location.href = "records.html";
                });

                pointsBttnProgress.addEventListener("click", () => {
                    window.location.href = "points.html";
                });

                rankingBttnProgress.addEventListener("click", () => {
                    window.location.href = "ranking.html";
                });

                actionsBttnProgress.addEventListener("click", () => {
                    window.location.href = "actions.html";
                });

                homeBttnProgress.addEventListener("click", () => {
                    window.location.href = "home.html";
                })
            })

            let page = 1;
            const limit = 6;
            let loading = false;

            async function loadActivs() {
                if (loading) {
                    return;
                }
                loading = true;

                const res = await fetch(`/api/activity?page=${page}&limit=${limit}`, { credentials: "include" });
                const data = await res.json();

                const tableBody = document.querySelector("#progressTable tbody");

                data.activities.forEach(act => {
                    const row = document.createElement("tr");
                    row.classList.add("activity-row", `${act.activity.toLowerCase().replace(/\s+/g, "-")}-row`);

                    const statusIco = {
                        pending: "../content/icons/trzykropki.png",
                        approved: "../content/icons/acc.png",
                        denied: "../content/icons/den.png",
                    }[act.status];

                    row.innerHTML = `
                        <td>
                            <img src="../content/icons/info.png" class=info-icon" data-id="${act._id}">
                            <img src="${statusIco}" class="status-icon">
                        </td>
                        <td>${new Date(act.createdAt).toLocaleDateString()}</td>
                        <td>${act.activity}</td>
                        <td>${act.distance.toFixed(2)} KM</td>
                        <td>${minutesToHHMM(act.timeInMins)}</td>
                        <td class="points">${act.points > 0 ? act.points.toFixed(3) : "-"}</td>
                    `;

                    tableBody.appendChild(row);
                });

                if (data.activities.length > 0) {
                    page++;
                    loading = false;
                };
            }

            const minutesToHHMM = (minutes) => {
                const h = Math.floor(minutes / 60).toString().padStart(2, "0");
                const m = (minutes % 60).toString().padStart(2, "0");
                return `${h}:${m}`;
            }

            window.addEventListener("scroll", () => {
                if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
                    loadActivs();
                }
            });

            loadActivs();
        </script>
    </body>
</html>
