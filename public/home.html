        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const scale = 1 / window.devicePixelRatio;
                document.body.style.transform = `scale(${scale})`;
                document.body.style.transformOrigin = 'top left';
                document.body.style.width = `${100 * window.devicePixelRatio}%`;
                document.body.style.height = `${100 * window.devicePixelRatio}%`;
                document.body.style.position = 'absolute';
                document.body.style.top = 0;
                document.body.style.left = 0;
            });
            document.addEventListener("DOMContentLoaded", () => {
                const dshBttnHomeV2 = document.getElementById("dshBttnHomeV2");
                const abtUsBttnHomeV2 = document.getElementById("abtUsBttnHomeV2");
                const scBttnHomeV2 = document.getElementById("scBttnHomeV2");

                dshBttnHomeV2.addEventListener("click", () => {
                    window.location.href = "dashboard.html";
                });

                abtUsBttnHomeV2.addEventListener("click", () => {
                    window.location.href = "about-us.html";
                });

                scBttnHomeV2.addEventListener("click", () => {
                    window.location.href = "actions.html";
                });
            })
            document.addEventListener("DOMContentLoaded", () => {
                if (window.devicePixelRatio <= 600) {
                    document.getElementById("titleHome").src = "../content/titles/welcome_title.png";
                    document.getElementById("homeText").src = "../content/texts/text_home.png";
                }
            })
            document.addEventListener("DOMContentLoaded", () => {
                const listBttnHome = document.getElementById("listBttnHome");
                const homeListRozw = document.getElementById("homeListRozw");
                const abtUsBttnHome = document.getElementById("abtUsBttnHome");
                const dshBttnHome = document.getElementById("dshBttnHome");
                const actionsBttnHome = document.getElementById("actionsBttnHome");
                const contactBttnHome = document.getElementById("contactBttnHome");
                const articlesBttnHome = document.getElementById("articlesBttnHome");
                const countriesBttnHome = document.getElementById("countriesBttnHome");
                const homeBttnHome = document.getElementById("homeBttnHome");
                const titleHome = document.getElementById("titleHome");
                const homeText = document.getElementById("homeText");

                listBttnHome.addEventListener("click", () => {
                    homeListRozw.classList.toggle("is-active-home");
                    titleHome.classList.toggle("is-darken-home");
                    homeText.classList.toggle("is-darken-home-2");
                });

                abtUsBttnHome.addEventListener("click", () => {
                    window.location.href = "about-us.html";
                });

                actionsBttnHome.addEventListener("click", () => {
                    window.location.href = "actions.html";
                });
                
                contactBttnHome.addEventListener("click", () => {
                    window.location.href = "contact.html";
                });

                articlesBttnHome.addEventListener("click", () => {
                    window.location.href = "articles.html";
                });

                countriesBttnHome.addEventListener("click", () => {
                    window.location.href = "countries.html";
                });

                dshBttnHome.addEventListener("click", () => {
                    window.location.href = "dashboard.html";
                });

                homeBttnHome.addEventListener("click", () => {
                    window.location.href = "home.html";
                });
            });
        </script>
