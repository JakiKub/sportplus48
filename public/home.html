<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sport +48 - Home</title>
        <link rel="shortcut icon" href="../content/logo-ikona-str.png">
        <link rel="stylesheet" href="/style.css">
        <script src="index.js" defer></script>
    </head>
    <body class="home">
        <div class="navbar-home" id="NavbarHome">
            <p><a href="home.html">home</a></p>
            <p><a href="about-us.html">about us</a></p>
            <p><a href="sports.html">sports</a></p>
            <p><a href="actions.html">actions</a></p>
            <p><a href="coutries.html">countries</a></p>
            <p><a href="contact.html">contact</a></p>
            <p class="troll">EN</p>
        </div>
        <div class="navbar-home-logged-in" id="NavbarHomeLoggedIn">
            <p><img src="../content/ikona-addactivity.png" class="add-activ-ico"><a href="add-activity.html">Add activity</a></p>
            <p><img src="../content/ikona-progress.png" class="progress-ico"><a>Progress</a></p>
            <p><img src="../content/ikona-records.png" class="records-ico"><a>Records</a></p>
            <p><img src="../content/ikona-ranking.png" class="ranking-ico"><a>Ranking</a></p>
            <p><img src="../content/ikona-48sportchallenge.png" class="challenge-ico"><a href="actions.html">48 Sport Challenge</a></p>
            <p><img src="../content/ikona-getinspired.png" class="inspir-ico"><a>Get inspired</a></p>
            <p><img src="../content/ikona-points.png" class="points-ico"><a>Points</a></p>
        </div>
        <div class="profile-container" id="profileContainer" style="display: none;">
            <h1 class="profile"><span id="username" class="profile"></span></h1>
            <p class="profile"><span id="nationality" class="profile"></span></p>
        </div>
        <button id="profileLogOut" class="profile-logout-button"><img src="../content/button-logout.png"></button>
        <div class="log-in-register">
            <button id="logInButton" class="log-in">LOG IN</button>
            <button id="registerButton" class="register">REGISTER</button>
        </div>
        <div id="logInModalContainer" class="log-in-modal-container">
            <div class="log-in-modal">
                <form id="logInForm">
                    <button id="logInClose" class="log-in-close"><img src="../content/x-button.png"></button>
                    <input type="email" id="logInEmail" name="email" class="email" required>
                    <input type="password" id="logInPassword" name="password" class="password" required>
                    <p><a href="forgot-password.html">forgot your password?</a></p>
                    <button type="submit" class="log-in-in-modal"><img src="../content/button-login.png"></button>
                </form>
            </div>
        </div>
        <div id="registerModalContainer" class="register-modal-container">
            <div class="register-modal">
                <form action="/register" method="post">
                    <button id="registerClose" class="register-close" type="button"><img src="../content/x-button.png"></button>
                    <input type="email" id="registerEmail" name="email" class="email" required>
                    <input type="password" id="registerPassword" name="password" class="password" required>
                    <input type="text" id="username" name="username" class="username" maxlength="20" required>
                    <input list="nationalities" name="nationality" class="nationalities">
                    <datalist id="nationalities" class="nationalities">
                        <option value="Poland">Poland</option>
                        <option value="England">England</option>
                    </datalist>
                    <p class="termsOfServiceText"><input type="checkbox" class="termsOfService" required>I accept terms of service</p>
                    <button type="submit" class="register-in-modal"><img src="../content/button-register.png"></button>
                </form>
            </div>
        </div>
        <div class="logo" id="logoHome">
            <div class="tiktok-logo">
                <a href="https://www.tiktok.com/@sportplus_48?_t=ZN-8y3YHZlLIAw&_r=1"><img src="../content/tiktok-png.png"></a>
            </div>
            <div class="instagram-logo">
                <a href="https://www.instagram.com/sportplus.48?igsh=MXFweHYyd204aTViMg=="><img src="../content/instagram-png.png"></a>
            </div>
        </div>
    </body>
</html>
