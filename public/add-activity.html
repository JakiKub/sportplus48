<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sport +48 - Add activity</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="../content/icons/logo-ikona-str.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    </head>
    <body class="add-activity">
        <img src="../content/logos/logohuju.png" class="logo-hóju">
        <div class="navbar-top-wrapper" id="navbarTopWrapper">
            <button id="userBttn" class="user-bttn"></button>
            <div id="navbarUserEmailTopWrapper" class="navbar-user-email-top-wrapper">
                <h3 class="navbar-logged-in-top-username"><span id="usernameTop"></span></h3>
                <p class="navbar-logged-in-top-email"><span id="emailTop"></span></p>
            </div>
        </div>
        <div class="navbar-add-activ-top">
            <button id="enBttn" class="en-bttn"></button>
            <button id="notifBttn" class="notif-bttn"></button>
            <button id="profileLogOutAddActiv" class="logout-bttn"></button>
        </div>
        <div class="navbar-logged-in" id="navbarAddActiv">
            <div class="navbar-logged-in-main">
                <img src="../content/titles/dsh main.png" class="main-dsh">
                <a href="dashboard.html"><img src="../content/titles/sb dashboard.png" class="dashboard-ico"></a>
                <a href="home.html"><img src="../content/titles/sb home.png" class="home-ico"></a>
            </div>
            <div class="navbar-logged-in-ypttt">
                <img src="../content/titles/dsh your.png" class="ypttp-dsh">
                <a href="add-activity.html"><img src="../content/titles/sb register activity.png" class="add-activ-ico"></a>
                <a href="progress.html"><img src="../content/titles/sb progress.png" class="progress-ico"></a>
                <a href="records.html"><img src="../content/titles/sb records.png" class="records-ico"></a>
                <a href="points.html"><img src="../content/titles/sb points.png" class="points-ico"></a>
            </div>
            <div class="navbar-logged-in-other">
                <img src="../content/titles/dsh other.png" class="other-dsh">
                <a href="ranking.html"><img src="../content/titles/sb ranking.png" class="ranking-ico"></a>
                <a href="actions.html"><img src="../content/titles/sb 48sc.png" class="challenge-ico"></a>
            </div>
        </div>
        <img src="../content/titles/register activity title.png" id="titleRegisterActiv">
        <form action="/api/activity" id="addActivForm" method="POST" enctype="multipart/form-data">
            <div class="activs-div">
                <p class="sel-activ">Select Activity</p><select name="activity" id="activs" required>
                    <option value="">SELECT ACTIVITY (pls dont choose this one i beg you ~ programmer)</option>
                    <option value="running">RUNNING</option>
                    <option value="nordic-walking">NORDIC WALKING</option>
                    <option value="cycling">CYCLING</option>
                    <option value="roller-skating">ROLLER SKATING</option>
                    <option value="scooter">SCOOTER (not an electric one)</option>
                    <option value="swimming">SWIMMING</option>
                    <option value="kayaking">KAYAKAING</option>
                    <option value="rowing">ROWING</option>
                    <option value="crosscountry-skiing">CROSS-COUNTRY SKIING</option>
                    <option value="skateboarding">SKATEBOARDING</option>
                    <option value="calisthenics">CALISTHENICS</option>
                    <option value="gym">GYM</option>
                    <option value="fitness">FITNESS OR</option>
                    <option value="crossfit">CROSSFIT</option>
                    <option value="zumba">ZUMBA</option>
                    <option value="aerobics">AEROBICS</option>
                    <option value="yoga">YOGA</option>
                    <option value="stretching">STRETCHING</option>
                    <option value="dancing">DANCING</option>
                    <option value="martial-arts">MARTIAL ARTS</option>
                    <option value="sport-gymnastics">SPORT GYMNASTICS</option>
                    <option value="football">FOOTBALL</option>
                    <option value="volleyball">VOLLEYBALL</option>
                    <option value="basketball">BASKETBALL</option>
                    <option value="handball">HANDBALL</option>
                    <option value="hockey">HOCKEY</option>
                    <option value="ice-hockey">ICE HOCKEY</option>
                    <option value="rugby">RUGBY</option>
                    <option value="floorball">FLOORBALL</option> <!--unihokej jakims cudem to jest-->
                    <option value="tennis">TENNIS</option>
                    <option value="squash">SQUASH</option>
                    <option value="paddle-tennis">PADDLE TENNIS</option>
                    <option value="badminton">BADMINTON</option>
                    <option value="climbing">CLIMBING</option>
                    <option value="rope-jumping">ROPE JUMPING</option>
                    <option value="ice-skating">ICE SKATING</option>
                    <option value="parkour">PARKOUR</option>
                    <option value="freerun">FREERUN</option>
                </select>
            </div>
            <div class="dist-time-div">
                <div class="dist-div">
                    <p class="dist-p">Distance</p><input type="number" name="distance" id="distance"><p class="km-p">KM</p>
                </div>
                <div class="time-div">
                    <p class="time-p">Time</p><input type="time" name="time" id="time">
                </div>
            </div>
            <div class="evid-div">
                <p class="evid-p">Upload Evidence</p>
                <input type="file" name="evidence" id="uploadEvidence" accept=".png,.jpg,.jpeg">
            </div>
            <button type="submit" id="submitBttn"></button>
        </form>
        <img src="../content/texts/discl.png" id="disclaimerIAmNotPlayingByTheRules">

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                if (window.devicePixelRatio === 1.25) {
                    document.querySelector("html").style.zoom = ".8";
                };
                if (window.devicePixelRatio === 1.5) {
                    document.querySelector('html').style.zoom = ".67";
                };
                if (window.devicePixelRatio === 1.75) {
                    document.querySelector('html').style.zoom = ".5";
                };
            });
            document.addEventListener("DOMContentLoaded", () => {
                const user = JSON.parse(localStorage.getItem("user"));

                const navbarUserEmailTopWrapper = document.getElementById("navbarUserEmailTopWrapper");

                if (user && navbarUserEmailTopWrapper) {
                    document.getElementById("usernameTop").textContent = user.username;
                    document.getElementById("emailTop").textContent = user.email;
                    //document.getElementById("navbarAddActivLoggedInTop").style.display = "flex";
                    document.getElementById("navbarAddActiv").style.display = "flex";
                }
            });

            const profileLogOutAddActiv = document.getElementById("profileLogOutAddActiv");
            if (profileLogOutAddActiv) {
                profileLogOutAddActiv.addEventListener("click", () => {
                localStorage.removeItem("user");
                location.href = "dashboard.html";
                //location.reload();
                });
            }

            document.addEventListener("DOMContentLoaded", () => {
                const timeInput = document.querySelector('input[type="time"]');

                timeInput.addEventListener("click", () => {
                    if (timeInput.showPicker) {
                        timeInput.showPicker();
                    }
                });
            })
            document.getElementById("userBttn").addEventListener("click", () => {
                window.location.href = 'dashboard.html';
            })
        </script>
    </body>
</html>
