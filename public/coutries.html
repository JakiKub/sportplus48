<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">   
        <title>Sport +48 - Countries</title>
        <link rel="shortcut icon" href="../content/icons/logo-ikona-str.png">
        <link rel="stylesheet" href="/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    </head>
    <body class="countries">
        <div class="navbar">
            <a href="dashboard.html">dashboard</a>
            <a href="home.html">home</a>
            <a href="about-us.html">about us</a>
            <a href="articles.html">articles</a>
            <a href="actions.html">actions</a>
            <a href="coutries.html">countries</a>
            <a href="contact.html">contact</a>
            <a class="troll"><img src="../content/buttons/en-bttn.png"></a>
        </div>
        <div class="jakies-napisy">
            <img src="../content/titles/Countries Title.png" id="countriesTitle">
            <img src="../content/texts/Napis1.png" id="napisJeden">
        </div>
        <div class="countries-counter">
            <div id="countriesNumber" data-value="0"></div>
            <img src="../content/texts/Napis2.png" id="napisDwa">
            <div class="countries-slider">
                <button id="countriesSlideLeft"><img src="../content/buttons/bt1.png"></button>
                <div id="currentCountry"></div>
                <button id="countriesSlideRight"><img src="../content/buttons/bt2.png"></button>

            </div>
        </div>
        <div class="logo">
            <div class="tiktok-logo">
                <a href="https://www.tiktok.com/@sportplus_48?_t=ZN-8y3YHZlLIAw&_r=1"><img src="../content/logos/tiktok-png.png"></a>
            </div>
            <div class="instagram-logo">
                <a href="https://www.instagram.com/sportplus.48?igsh=MXFweHYyd204aTViMg=="><img src="../content/logos/instagram-png.png"></a>
            </div>
        </div>
        <img src="../content/misc/earth-countries.png" id="earthCountries">

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const scale = 1 / window.devicePixelRatio;
                document.body.style.transform = `scale(${scale})`;
                document.body.style.transformOrigin = 'top left';
                document.body.style.width = `${100 * window.devicePixelRatio}%`;
                document.body.style.height = `${100 * window.devicePixelRatio}%`;
                document.body.style.position = 'absolute';
                document.body.style.top = 0;
                document.body.style.left = 0;
            });
            
            document.addEventListener("DOMContentLoaded", () => {
                const countriesNumber = document.getElementById("countriesNumber");
                countriesNumber.textContent = countriesNumber.dataset.value;

                const countriesSlideLeft = document.getElementById("countriesSlideLeft");
                const countriesSlideRight = document.getElementById("countriesSlideRight");
                const currentCountry = document.getElementById("currentCountry");

                const countrySlideLeft = document.getAnimations("countrySlideLeft")[0];
                const countrySlideRight = document.getAnimations("countrySlideRight")[0];

                const countries = [
                    "POL",
                    "HUN",
                    "ESP",
                ]
                let currentIndex = 0;

                countriesSlideRight.onclick = function() {
                    currentIndex = (currentIndex + 1) % countries.length;
                    updateCountries();

                    currentCountry.classList.remove('slide-left');
                    
                    void currentCountry.offsetWidth;

                    currentCountry.classList.add('slide-left');
                }
                countriesSlideLeft.onclick = function() {
                    currentIndex = (currentIndex - 1 + countries.length) % countries.length;
                    updateCountries();

                    currentCountry.classList.remove('slide-right');
                    
                    void currentCountry.offsetWidth;

                    currentCountry.classList.add('slide-right');
                }

                const updateCountries = () => {
                    const currentBackground = countries[currentIndex];
                    currentCountry.style.backgroundImage = `url('../content/icons/${currentBackground}-countries.png')`;
                }
            })
        </script>
    </body>
</html>
